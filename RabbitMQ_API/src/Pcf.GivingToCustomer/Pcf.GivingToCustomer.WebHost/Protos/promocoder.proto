syntax = "proto3";

option csharp_namespace = "Pcf.GivingToCustomer.WebHost";

package promocode;

// The service definition
service Promocoder {
  rpc GivePromoCodeToCustomer (GivePromoCodeToCustomerRequest) returns (GivePromoCodeToCustomerReply);
}

// The request message
message GivePromoCodeToCustomerRequest {
  string ServiceInfo = 1;
  string PartnerId = 2;
  string PromoCodeId = 3;
  string PromoCode = 4;
  string PreferenceId = 5;
  string BeginDate = 6;
  string EndDate = 7;
  string PartnerManagerId = 8;
}

// The response message
message GivePromoCodeToCustomerReply {
  string message = 1;
}
